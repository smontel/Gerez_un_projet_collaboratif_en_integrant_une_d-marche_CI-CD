name: CI/CD BobApp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test-back:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run tests and generate Jacoco report
        working-directory: back
        run: mvn clean test

      - name: Upload Jacoco coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco/

  test-front:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: front
        run: npm install

      - name: Run tests and generate coverage report
        working-directory: front
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: front-coverage-report
          path: front/coverage/bobapp/

  sonar-back:
    runs-on: ubuntu-latest
    needs: test-back
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Analyze back with SonarCloud
        working-directory: back
        run: mvn verify sonar:sonar
          -Dsonar.projectKey=smontel-bobapp-back
          -Dsonar.organization=smontel
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN_BACK }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK }}

  sonar-front:
    runs-on: ubuntu-latest
    needs: test-front
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Analyze front with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}
        with:
          projectBaseDir: front
          args: >
            -Dsonar.projectKey=smontel-bobapp-front
            -Dsonar.organization=smontel
